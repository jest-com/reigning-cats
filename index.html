<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <script src="https://cdn.jest.com/sdk/latest/jestsdk.js"></script>
    <title>Reigning Cats</title>
    <style>
      /* Name input overlay */
      #name-input-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        font-family: 'Courier New', monospace;
        color: #ffffff;
        z-index: 1000;
        display: block;
      }

      #name-input-container h1 {
        font-size: 48px;
        color: #ffff00;
        text-shadow: 0 0 10px #ffff00, 0 0 20px #ffff00;
        margin-bottom: 20px;
        letter-spacing: 4px;
      }

      #crown-cat-image {
        width: 200px;
        height: 200px;
        margin-bottom: 20px;
        filter: drop-shadow(0 0 20px rgba(255, 255, 0, 0.5));
      }

      /* Mobile optimizations */
      @media (max-width: 768px) {
        #name-input-container {
          top: 45%;
        }

        #name-input-container h1 {
          font-size: 36px;
          margin-bottom: 15px;
        }

        #crown-cat-image {
          width: 120px;
          height: 120px;
          margin-bottom: 15px;
        }

        #name-input-container .input-box {
          padding: 25px !important;
        }

        #player-name {
          width: 250px !important;
          font-size: 20px !important;
          padding: 12px !important;
          margin-bottom: 20px !important;
        }

        #start-game-btn {
          width: 250px !important;
          font-size: 24px !important;
          padding: 12px !important;
        }
      }

      #name-input-container .input-box {
        background: rgba(74, 111, 165, 0.9);
        padding: 40px;
        border: 3px solid #1AFF44;
        box-shadow: 0 0 20px #1AFF44;
        border-radius: 10px;
      }

      #name-input-container label {
        display: block;
        font-size: 24px;
        color: #ffffff;
        margin-bottom: 20px;
        text-shadow: 0 0 5px #000000;
      }

      #player-name {
        width: 300px;
        font-size: 24px;
        padding: 15px;
        background: #1a1a2e;
        color: #1AFF44;
        border: 3px solid #ffff00;
        text-align: center;
        font-family: 'Courier New', monospace;
        text-transform: uppercase;
        box-shadow: inset 0 0 10px rgba(255, 255, 0, 0.3);
        margin-bottom: 30px;
        border-radius: 5px;
      }

      #player-name::placeholder {
        color: rgba(26, 255, 68, 0.5);
      }

      #start-game-btn {
        width: 300px;
        font-size: 32px;
        padding: 15px;
        background: #1AFF44;
        color: #000000;
        border: 3px solid #ffffff;
        cursor: pointer;
        font-family: 'Courier New', monospace;
        font-weight: bold;
        text-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
        box-shadow: 0 0 20px #1AFF44;
        transition: all 0.2s;
        border-radius: 5px;
      }

      #start-game-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 0 30px #1AFF44;
        background: #15CC37;
      }
    </style>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        line-height: 1;
        font-family: Arial, sans-serif;
        background-color: #1a1a2e;
      }

      #game-container {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="name-input-container">
      <h1>REIGNING CATS</h1>
      <img id="crown-cat-image" src="molly-cat-crown-512x512.png" alt="Cat with Crown" />
      <div class="input-box">
        <label for="player-name">ENTER YOUR NAME</label>
        <input
          type="text"
          id="player-name"
          maxlength="20"
          autocomplete="off"
          data-form-type="other"
          data-lpignore="true"
          data-1p-ignore="true"
          placeholder="PLAYER 1"
        />
        <button id="start-game-btn">START GAME</button>
      </div>
    </div>
    <div id="game-container"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
