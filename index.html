<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <script src="https://cdn.jest.com/sdk/latest/jestsdk.js"></script>
    <title>Reigning Cats</title>
    <style>
      /* Name input overlay */
      #name-input-container {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow-y: auto;
        padding: 20px 12px;
        text-align: center;
        font-family: "Courier New", monospace;
        color: #ffffff;
        z-index: 1000;
      }

      /* Center the stack when it fits, but let it scroll from the top
         (rather than clipping the title) when it's taller than the screen. */
      #name-input-container > :first-child {
        margin-top: auto;
      }
      #name-input-container > :last-child {
        margin-bottom: auto;
      }

      #name-input-container h1 {
        font-size: 48px;
        color: #ffff00;
        text-shadow:
          0 0 10px #ffff00,
          0 0 20px #ffff00;
        margin-bottom: 20px;
        letter-spacing: 4px;
      }

      #crown-cat-image {
        width: 200px;
        height: 200px;
        margin-bottom: 20px;
        filter: drop-shadow(0 0 20px rgba(255, 255, 0, 0.5));
      }

      #jest-logo {
        width: 104px;
        height: auto;
        margin-top: 24px;
        opacity: 0.85;
      }

      /* Mobile optimizations */
      @media (max-width: 768px) {
        #name-input-container {
          padding: 12px;
        }

        #name-input-container h1 {
          font-size: 36px;
          margin-bottom: 15px;
        }

        #crown-cat-image {
          width: 120px;
          height: 120px;
          margin-bottom: 15px;
        }

        #name-input-container .input-box {
          padding: 25px !important;
        }

        #player-name {
          font-size: 20px !important;
          padding: 12px !important;
          margin-bottom: 20px !important;
        }

        #start-game-btn {
          font-size: 24px !important;
          padding: 12px !important;
        }
      }

      #name-input-container .input-box {
        width: 100%;
        max-width: 386px;
        background: rgba(74, 111, 165, 0.9);
        padding: 40px;
        border: 3px solid #1aff44;
        box-shadow: 0 0 20px #1aff44;
        border-radius: 10px;
      }

      #name-input-container label {
        display: block;
        font-size: 24px;
        color: #ffffff;
        margin-bottom: 20px;
        text-shadow: 0 0 5px #000000;
      }

      #player-name {
        width: 100%;
        font-size: 24px;
        padding: 15px;
        background: #1a1a2e;
        color: #1aff44;
        border: 3px solid #ffff00;
        text-align: center;
        font-family: "Courier New", monospace;
        text-transform: uppercase;
        box-shadow: inset 0 0 10px rgba(255, 255, 0, 0.3);
        margin-bottom: 30px;
        border-radius: 5px;
      }

      #player-name::placeholder {
        color: rgba(26, 255, 68, 0.5);
      }

      #start-game-btn {
        width: 100%;
        font-size: 32px;
        padding: 15px;
        background: #1aff44;
        color: #000000;
        border: 3px solid #ffffff;
        cursor: pointer;
        font-family: "Courier New", monospace;
        font-weight: bold;
        text-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
        box-shadow: 0 0 20px #1aff44;
        transition: all 0.2s;
        border-radius: 5px;
      }

      #start-game-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 0 30px #1aff44;
        background: #15cc37;
      }

      .shop-btn {
        font-size: 16px;
        padding: 10px 15px;
        background: #1a1a2e;
        color: #ffffff;
        border: 2px solid #1aff44;
        cursor: pointer;
        font-family: "Courier New", monospace;
        font-weight: bold;
        border-radius: 5px;
        transition: all 0.2s;
      }

      .shop-btn:hover {
        background: #2a2a4e;
        box-shadow: 0 0 10px #1aff44;
      }
    </style>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        line-height: 1;
        font-family: Arial, sans-serif;
        background-color: #1a1a2e;
      }

      #game-container {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="name-input-container">
      <h1>REIGNING CATS</h1>
      <img
        id="crown-cat-image"
        src="molly-cat-crown-512x512.png"
        alt="Cat with Crown"
      />
      <div class="input-box">
        <label for="player-name">ENTER YOUR NAME</label>
        <input
          type="text"
          id="player-name"
          maxlength="20"
          autocomplete="off"
          data-form-type="other"
          data-lpignore="true"
          data-1p-ignore="true"
          placeholder="PLAYER 1"
        />
        <div id="shop-container">
          <label
            style="
              font-size: 20px;
              color: #ffff00;
              display: block;
              margin: 15px 0 10px;
              text-shadow: 0 0 5px #000000;
            "
            >POWER-UPS</label
          >
          <div
            id="shop-products"
            style="
              display: flex;
              gap: 8px;
              justify-content: center;
              flex-wrap: wrap;
            "
          ></div>
          <div
            id="shop-status"
            style="
              color: #1aff44;
              font-size: 14px;
              min-height: 20px;
              margin-top: 8px;
            "
          ></div>
        </div>
        <button id="start-game-btn">START GAME</button>
      </div>
      <img id="jest-logo" src="jest-logo-dark.svg" alt="Jest" />
    </div>
    <div id="game-container"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
